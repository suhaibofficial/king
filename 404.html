<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | SuhaiB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      text-align: center;
    }

    .error {
      padding: 30px;
    }

    h1 {
      margin: 0;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -4px;
    }

    p {
      margin: 10px 0 24px;
      color: #888;
      font-size: 15px;
    }

    a {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s ease;
    }

    a:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

  <main class="error">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="https://suhaib.org">Home</a>
  </main>

</body>
</html>
